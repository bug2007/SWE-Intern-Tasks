<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.png">
    <title>myDreamPlace | Home</title>
    <style>
        body {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top pt-3">
        <div class="container-md">
            <div class="brand">
                <img src="images/favicon.png" alt="">
                <a href="index.html" class="navbar-brand ms-1">my Dream Place</a>
            </div>
        </div>
    </nav>

    <div class="container-md d-grid align-items-center" style="height: 100vh;">
        <div class="row justify-content-center mt-3">
            <div class="col-6">
                <form id="register" style="width: 400px;" class="mx-auto">
                    <fieldset>
                        <legend class="text-center mb-4 fw-semibold">Register</legend>
                        <div class="mb-4">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" id="email" required class="form-control border-0" style="background-color: rgba(242, 242, 242, 1);">
                        </div>
                        <button type="submit" id="continue-with-email" class="py-2 btn btn-primary w-100">Continue with email</button>
                        <div class="d-flex align-items-center my-4">
                            <div class="flex-grow-1 border-bottom"></div>
                            <span class="mx-3 text-muted small">or use one of these options</span>
                            <div class="flex-grow-1 border-bottom"></div>
                        </div>
                        <button type="button" class="py-2 btn border mb-2 w-100"><img src="images/google.png" class="me-2 align-top" style="width: 20px; height: 20px;" alt="">Continue with Google</button>
                        <button type="button" class="py-2 btn w-100 text-white" style="background-color: rgba(71, 89, 147, 1);"><img src="images/facebook.png" class="me-2 align-top" alt="">Continue with Facebook</button>
                        <p class="small text-muted mt-5 text-center">Already have an account? <a href="sign-in.html" class="text-decoration-none">Sign in</a></p>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
