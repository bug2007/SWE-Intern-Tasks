<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.png">
    <title>myDreamPlace | Home</title>
    <style>
        body {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top pt-3">
        <div class="container-md">
            <div class="brand">
                <img src="images/favicon.png" alt="">
                <a href="index.html" class="navbar-brand ms-1">my Dream Place</a>
            </div>
        </div>
    </nav>

    <div class="container-md d-grid align-items-center" style="height: 100vh;">
        <div class="row justify-content-center mt-3">
            <div class="col-6">
                <form id="forgot-password" style="width: 400px;" class="mx-auto">
                    <fieldset>
                        <legend class="text-center fw-semibold">Forgot your password?</legend>
                        <p class="text-center text-muted mb-4">We'll send you a link to reset it. Enter your email address used for My Dream Place</p>
                        <div class="mb-4">
                            <label for="email" class="form-label">Your email address</label>
                            <input type="email" name="email" id="email" required class="form-control border-0" style="background-color: rgba(242, 242, 242, 1);">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                        <p class="text-muted mt-4" style="font-size: 14px;">By creating an account, you agree with our <span class="text-primary">Terms and Conditions</span> and <span class="text-primary">Privacy Statement.</span></p>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
